# Limine bootloader -konfiguraatio Zinux-kernelille.
# Limine lukee tämän tiedoston ISO:n /boot/limine/ -hakemistosta.

# Timeout sekunteina ennen automaattista boottia (0 = ei timeoutia).
TIMEOUT=0

# Oletusvalinta boot-valikossa (1 = ensimmäinen entry).
DEFAULT_ENTRY=1

# Ota serial debug -tulostus käyttöön COM1:stä (QEMU: -serial stdio).
SERIAL=1

# Boot-valikon entry: Zinux kernel.
:Zinux
    # Polku kernel ELF -tiedostoon ISO:ssa.
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/zinux-kernel
    # Kernel-komentoriviparametrit (Limine välittää kernelille).
    KERNEL_CMDLINE=console=serial0
