# Limine 12.x konfiguraatio — Zinux kernel.
# Dokumentaatio: https://github.com/limine-bootloader/limine/blob/v12.x-branch/CONFIG.md

# Automaattinen boot 3 sekunnin kuluttua (CI/QEMU headless).
timeout: 3

# Serial debug COM1:een (QEMU: -serial stdio).
serial: yes

# Zinux kernel -boot entry.
/Zinux
    randomise_hhdm_base: yes
    protocol: limine
    kernel_path: boot():/boot/zinux-kernel
